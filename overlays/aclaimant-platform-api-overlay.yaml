- target: $.paths['/v1/bulk/answers'].post
  update:
    operationId: bulkCreateAnswers
- target: $.paths['/v1/bulk/answer-updates'].post
  update:
    operationId: bulkUpdateAnswers
- target: $.paths['/v2/bulk/answers'].post
  update:
    operationId: bulkUpsertAnswers
- target: $.paths['/v2/bulk/policies'].post
  update:
    operationId: bulkUpsertPolicies
- target: $.paths['/v2/bulk/programs'].post
  update:
    operationId: bulkUpsertPrograms
- target: $.paths['/v2/bulk/exposures'].post
