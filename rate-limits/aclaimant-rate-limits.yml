note: >-
  Aclaimant publishes no numeric rate limit. The Partner API error table documents the exhaustion condition -
  "429 Too Many Requests - You're requesting too frequently. Slow down." - but names no quota, window, burst
  or per-key/per-account scope, and the Platform API Swagger declares no 429 response on any of its 25
  operations. An honest zero: the throttle exists, the number does not.
