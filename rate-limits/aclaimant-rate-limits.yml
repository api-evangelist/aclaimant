    observed 2026-09-06), returns no rate-limit header of any kind.
backpressure:
  mechanism: enqueue-and-poll for bulk writes
  detail: >-
    The seven bulk operations enqueue a job and return a status URL polled at GET /v1/bulk/status/{id} rather
    than rate-limiting a synchronous loop. This is the surface's real answer to volume, and it is the pattern
    an agent should use instead of fanning out single writes.
