- name: Aclaimant Partner / Third-party API
  description: >-
    Callback API for TPAs, carriers, brokers and other Aclaimant partners working claims on behalf of an
    Aclaimant customer. Base URL https://api.aclaimant.com/partner, bearer-token authorization issued by
    Aclaimant. Two documented endpoints - POST /claims/{claim-id}/receipt to acknowledge a submitted claim
    with the partner's own claim number and receipt status, and PUT /claims/{claim-id} to post claim status
    and the latest loss-run claim-report financials (medical, indemnity, expense, legal, vocational,
    recovery, general, property-damage, cargo-loss, cargo-damage) back into Aclaimant. Documented on the
    public developer portal; no machine-readable contract is published for this surface.
  humanURL: https://developer.aclaimant.com/partner/index.html
  baseURL: https://api.aclaimant.com/partner
