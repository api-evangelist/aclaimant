aid: aclaimant
name: Aclaimant
description: >-
  Aclaimant is a Chicago-based risk management information system (RMIS) used by policyholders, insurance
  brokers, carriers and third-party administrators to run incident reporting and first notice of loss (FNOL),
  claims management and analytics, safety and loss control, OSHA logs, policy management, and assets and
  exposures from one workflow platform. Its machine-readable surface is the Aclaimant Platform API — a
  Swagger 2.0 contract published at api.aclaimant.com/api with a live Swagger UI console — which lets
  integrators create and upsert answer bundles, incidents, claims, claim reports, events, files, companies,
  policies, policy programs, exposures and exposure summations, including bulk jobs with a status endpoint.
  A separate Partner / Third-party API at api.aclaimant.com/partner lets carriers, TPAs and brokers
  acknowledge claim receipt and post loss-run claim financial updates back into Aclaimant.
