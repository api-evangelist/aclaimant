apis:
- name: Aclaimant Platform API
  description: >-
    The Aclaimant Platform API (x-id "platform-api") is the end-user integration surface for a company or
    collective on the Aclaimant platform. Swagger 2.0, base path /api, JSON in and JSON / transit+json / edn
    out, authenticated with the x-aclaimant-api-key header. 25 operations across answers (workflow answer
    bundles), incidents, claims and claim reports, events and event types, files, companies, policies,
    policy programs, exposures and exposure summations, plus v2 bulk upsert jobs that enqueue work and return
    a status URL polled at /v1/bulk/status/{id}.
  humanURL: https://api.aclaimant.com/api/index.html
  baseURL: https://api.aclaimant.com/api
